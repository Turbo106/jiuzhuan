<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九转工具蛊</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--txt:#e8ecf3;--dim:#8b93a7}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;max-width:1500px;background:radial-gradient(1200px 600px at 20% -10%,#1b2333,transparent),var(--bg);
       color:var(--txt);font:14px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       padding:18px 16px 40px}
  h1{font-size:18px;margin:0 0 3px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}

  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
  .bar .lbl{font-size:12px;color:var(--dim);margin-right:4px}
  .chip{border:1px solid var(--line);background:#161b24;color:var(--dim);border-radius:999px;
        padding:5px 11px;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums;transition:.15s}
  .chip:hover{border-color:#3a4560;color:#c9d3e6}
  .chip.on{background:linear-gradient(150deg,#2b6cff,#1b48b3);border-color:#3b74ff;color:#fff;
           box-shadow:0 4px 14px rgba(43,108,255,.35)}

  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  .grid{display:grid;grid-template-columns:96px repeat(7,minmax(150px,1fr));min-width:1150px}
  .hd{position:sticky;top:0;z-index:4;background:#1c212b;border-bottom:1px solid var(--line);
      padding:9px 6px;text-align:center;font-weight:600;font-size:13px;color:var(--dim)}
  .hd small{display:block;font-weight:400;font-size:11px;color:#6f7891;margin-top:2px}
  .hd.has{color:#fff;background:#22304a}
  .tl{position:sticky;left:0;z-index:3;background:#1a1f28;border-right:1px solid var(--line);
      border-bottom:1px solid #20252f;padding:6px 8px;display:flex;flex-direction:column;justify-content:center}
  .tl b{font-size:13px;font-weight:600}
  .tl span{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .tl.sec{border-top:2px solid #33405c}
  .cell{border-right:1px solid #1e232d;border-bottom:1px solid #1e232d}
  .cell.sec{border-top:2px solid #33405c}

  .card{margin:3px;border-radius:10px;padding:9px 10px;color:#fff;
        box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);
        display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden;z-index:1}
  .card b{font-size:13px;font-weight:600;line-height:1.3;word-break:break-word}
  .card span{font-size:11px;opacity:.94;line-height:1.35;word-break:break-word}
  .card .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;opacity:.98}
  .card hr{border:0;border-top:1px solid rgba(255,255,255,.28);margin:1px 0;width:100%}
  .card.narrow{margin:3px 2px;padding:7px 7px;width:calc(50% - 5px)}
  .card.narrow b{font-size:11.5px}
  .card.narrow span{font-size:10px}
  .card.narrow .t{font-size:10.5px}
  .ln0{justify-self:start}
  .ln1{justify-self:end}

  .g0{background:linear-gradient(150deg,#2b6cff,#1b48b3)}
  .g1{background:linear-gradient(150deg,#8b5cf6,#5b32b8)}
  .g2{background:linear-gradient(150deg,#e0912f,#a8631a)}
  .g3{background:linear-gradient(150deg,#16a085,#0d6b58)}
  .g4{background:linear-gradient(150deg,#e2557b,#a12b4c)}
  .g5{background:linear-gradient(150deg,#4f9ded,#245a9c)}
  .g6{background:linear-gradient(150deg,#c2410c,#8a2d08)}
  .g7{background:linear-gradient(150deg,#7c3aed,#4c1d95)}
  .g8{background:linear-gradient(150deg,#0ea5e9,#0369a1)}
  .g9{background:linear-gradient(150deg,#84cc16,#4d7c0f)}

  h2{font-size:13px;color:var(--dim);margin:22px 0 8px;font-weight:600;letter-spacing:.5px}
  .list{display:grid;gap:8px}
  .row{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);
       border-radius:10px;padding:10px 12px;font-size:12.5px}
  .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .row .nm{font-weight:600;flex:1;min-width:0}
  .row .meta{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right;line-height:1.5}
  .empty{color:#6f7891;font-size:12px;padding:8px 2px}
  .note{margin-top:18px;color:var(--dim);font-size:11px;line-height:1.8}
  .note code{background:#1c212b;padding:1px 5px;border-radius:4px;color:#b9c2d6}
</style>
</head>
<body>
<h1>九转工具蛊</h1>
<div class="sub">2026–2027 第一学期 · 一节课 45 分钟 · 按周次筛选 · 同一时段不同周次的课并排显示</div>

<div class="bar" id="weeks"></div>
<div class="wrap"><div class="grid" id="grid"></div></div>

<h2 id="listTitle">本周课程</h2>
<div class="list" id="list"></div>

<div class="note">
  色块 = 上课时段，内含 起止时间 · 节次 · 周次 · 教师 · 教室；午休 12:15–14:00、晚饭 18:15–19:00 不占格子<br>
  地点省略了统一的「海南校区」，只写楼名与房间号
</div>

<script>
/* ---------- 13 节课 ---------- */
const P = [
  ['第1节','08:00','08:45'],['第2节','08:50','09:35'],['第3节','09:50','10:35'],
  ['第4节','10:40','11:25'],['第5节','11:30','12:15'],['第6节','14:00','14:45'],
  ['第7节','14:50','15:35'],['第8节','15:50','16:35'],['第9节','16:40','17:25'],
  ['第10节','17:30','18:15'],['第11节','19:00','19:45'],['第12节','19:50','20:35'],
  ['第13节','20:45','21:30']
];
const SECTIONS = {1:1, 6:1, 11:1};
const MAXW = 20;

/* ---------- 课程 ----------
   d 星期1-7 | s,e 起止节 | w 周次区间 | place 地点
   -------------------------------------------------- */
const COURSES = [
  /* 星期一 */
  {d:1,s:3,e:5,  name:'钢琴小组课（一）_01',        teacher:'陈思远',     w:[3,4],   place:'民大专享楼博雅楼303'},
  {d:1,s:6,e:7,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[3,3],   place:'民大专享楼博雅楼217'},
  {d:1,s:6,e:7,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[4,17],  place:'公共教学楼301'},
  {d:1,s:8,e:10, name:'中华民族共同体概论_02',       teacher:'彭谦',       w:[3,9],   place:'公共教学楼109'},
  {d:1,s:8,e:9,  name:'大学生思想文化素养_02',       teacher:'宝艳园',     w:[10,18], place:'公共教学楼109'},
  /* 星期二 */
  {d:2,s:1,e:2,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[4,5],   place:'民大专享楼博文楼302'},
  {d:2,s:1,e:2,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[7,17],  place:'公共教学楼301'},
  {d:2,s:6,e:7,  name:'中国音乐史_01',              teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼404'},
  {d:2,s:8,e:10, name:'人工智能素养_02',            teacher:'杨国胜',     w:[7,18],  place:'公共教学楼509'},
  /* 星期三 */
  {d:3,s:3,e:4,  name:'音乐基础理论与视唱练耳（一）_01', teacher:'南思羽',  w:[3,18],  place:'民大专享楼博雅楼404'},
  {d:3,s:6,e:7,  name:'音乐基础理论与视唱练耳（一）_01', teacher:'南思羽',  w:[3,4],   place:'民大专享楼博雅楼301'},
  {d:3,s:8,e:10, name:'中华民族共同体概论_02',       teacher:'彭谦',       w:[3,7],   place:'公共教学楼109'},
  {d:3,s:8,e:9,  name:'大学生思想文化素养_02',       teacher:'宝艳园',     w:[10,18], place:'公共教学楼109'},
  /* 星期四 */
  {d:4,s:1,e:2,  name:'人工智能素养_02',            teacher:'杨国胜',     w:[6,14],  place:'公共教学楼216'},
  {d:4,s:3,e:4,  name:'中国音乐史_01',              teacher:'郭艺婧',     w:[3,4],   place:'民大专享楼博雅楼404'},
  {d:4,s:6,e:7,  name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,5],   place:'民大专享楼博雅楼301'},
  {d:4,s:8,e:10, name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼301'},
  /* 星期五 */
  {d:5,s:3,e:5,  name:'钢琴小组课（一）_01',         teacher:'陈思远',     w:[3,18],  place:'民大专享楼博雅楼303'},
  {d:5,s:6,e:7,  name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,5],   place:'民大专享楼博雅楼301'},
  {d:5,s:8,e:10, name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼301'},
  {d:5,s:11,e:12,name:'大学体育（一）_04',           teacher:'李文华',     w:[3,18],  place:'运动场所游泳馆1楼'}
];

const DAYS=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
let curWeek='all';

/* 周次筛选 */
const wb=document.getElementById('weeks');
wb.innerHTML='<span class="lbl">周次</span><button class="chip on" data-w="all">全部</button>'+
  Array.from({length:MAXW},(_,i)=>`<button class="chip" data-w="${i+1}">第${i+1}周</button>`).join('');
wb.addEventListener('click',ev=>{
  const b=ev.target.closest('.chip'); if(!b) return;
  curWeek = b.dataset.w==='all' ? 'all' : +b.dataset.w;
  wb.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  render();
});

const active = c => curWeek==='all' || (curWeek>=c.w[0] && curWeek<=c.w[1]);
const wkText = c => c.w[0]===c.w[1] ? `第 ${c.w[0]} 周` : `${c.w[0]}–${c.w[1]} 周`;
const overlap = (a,b) => a.d===b.d && a.s<=b.e && b.s<=a.e;

/* 同一课程固定配色 */
function colorOf(name, list){
  const i = [...new Set(list.map(c=>c.name))].indexOf(name);
  return 'g'+(i%10);
}

function render(){
  const all = COURSES.slice().sort((a,b)=>a.d-b.d||a.s-b.s);
  const shown = all.filter(active);
  const grid = document.getElementById('grid');
  grid.style.gridTemplateRows = 'auto repeat(13,minmax(52px,auto))';

  /* 表头 */
  let html='<div class="hd">节次 / 时间</div>';
  DAYS.forEach((d,i)=>{
    const n = shown.filter(c=>c.d===i+1).length;
    html += `<div class="hd${n?' has':''}">${d}<small>${n?n+' 门':'无课'}</small></div>`;
  });

  /* 13 行节次 */
  P.forEach((p,i)=>{
    const n=i+1, sec = SECTIONS[n] ? ' sec' : '';
    html += `<div class="tl${sec}" style="grid-row:${n+1};grid-column:1"><b>${p[0]}</b><span>${p[1]} – ${p[2]}</span></div>`;
    for(let d=1;d<=7;d++) html += `<div class="cell${sec}" style="grid-row:${n+1};grid-column:${d+1}"></div>`;
  });

  /* 课程色块（重叠时段左右分栏） */
  shown.forEach(c=>{
    const rivals = shown.filter(o=>o!==c && overlap(o,c));
    const lane = rivals.length ? (rivals.filter(o=>o.s<c.s||(o.s===c.s&&o.w[0]<c.w[0])).length % 2) : 0;
    const narrow = rivals.length ? ' narrow ln'+(lane?1:0) : '';
    html += `<div class="card ${colorOf(c.name,all)}${narrow}" style="grid-row:${c.s+1} / ${c.e+2};grid-column:${c.d+1}">
      <b>${c.name}</b>
      <span class="t">${P[c.s-1][1]}–${P[c.e-1][2]} · ${c.s}–${c.e}节</span>
      <hr>
      <span>${wkText(c)}　${c.teacher}</span>
      <span>${c.place}</span>
    </div>`;
  });
  grid.innerHTML = html;

  /* 课程清单 */
  document.getElementById('listTitle').textContent =
    curWeek==='all' ? `全部课程（共 ${shown.length} 个上课时段）` : `第 ${curWeek} 周课程（${shown.length} 个时段）`;
  const list = document.getElementById('list');
  if(!shown.length){ list.innerHTML='<div class="empty">这一周没有课</div>'; return; }
  list.innerHTML = shown.map(c=>`
    <div class="row">
      <span class="dot ${colorOf(c.name,all)}"></span>
      <span class="nm">${c.name}</span>
      <span class="meta">${DAYS[c.d-1]} ${P[c.s-1][1]}–${P[c.e-1][2]}<br>${c.s}–${c.e}节 · ${wkText(c)} · ${c.place}</span>
    </div>`).join('');
}
render();
</script>
</body>
</html>
