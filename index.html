<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>九转工具蛊 · 课表</title>
<style>
  :root{
    --bg:#07080c;
    --ink:#eef1f7;
    --dim:rgba(238,241,247,.56);
    --faint:rgba(238,241,247,.32);
    --line:rgba(255,255,255,.07);
    --panel:rgba(255,255,255,.035);
    --ease:cubic-bezier(.22,1,.36,1);
    --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100dvh;
  }

  /* ---------- 背景光场 ---------- */
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:blur(80px);opacity:.5}
  .aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen}
  .aurora i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-8vh;background:radial-gradient(circle,rgba(79,140,255,.55),transparent 65%);animation:drift1 28s var(--ease) infinite alternate}
  .aurora i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:8vh;background:radial-gradient(circle,rgba(160,107,255,.45),transparent 65%);animation:drift2 34s var(--ease) infinite alternate}
  .aurora i:nth-child(3){width:36vw;height:36vw;left:30vw;bottom:-12vh;background:radial-gradient(circle,rgba(46,211,163,.28),transparent 68%);animation:drift3 40s var(--ease) infinite alternate}
  @keyframes drift1{to{transform:translate3d(12vw,8vh,0) scale(1.15)}}
  @keyframes drift2{to{transform:translate3d(-10vw,12vh,0) scale(.9)}}
  @keyframes drift3{to{transform:translate3d(6vw,-10vh,0) scale(1.1)}}
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:64px 64px;-webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%);mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%)}
  .vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,transparent 40%,rgba(0,0,0,.55) 100%)}

  .wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 22px 60px}

  /* ---------- 头部 ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
         opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) .05s forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .kicker{font-size:11px;letter-spacing:.26em;color:var(--faint);display:flex;align-items:center;gap:9px}
  .kicker .live{width:6px;height:6px;border-radius:50%;background:#2ed3a3;box-shadow:0 0 12px #2ed3a3;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
  h1{margin:12px 0 0;font-size:clamp(28px,4.4vw,44px);font-weight:650;letter-spacing:-.03em;line-height:1.05}
  h1 span{background:linear-gradient(96deg,#4f8cff,#a06bff 45%,#2ed3a3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:10px;color:var(--dim);font-size:13px}
  .stat{display:flex;gap:26px;margin-top:6px}
  .stat div{display:flex;flex-direction:column;gap:2px}
  .stat b{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat small{font-size:10.5px;letter-spacing:.16em;color:var(--faint)}

  /* ---------- 周次 ---------- */
  .weeks{margin-top:26px;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;
         opacity:0;animation:rise .9s var(--ease) .14s forwards}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:0 0 auto;position:relative;border:1px solid var(--line);background:var(--panel);color:var(--dim);
      border-radius:13px;padding:9px 15px;font:inherit;font-size:12.5px;cursor:pointer;
      transition:all .4s var(--ease);backdrop-filter:blur(10px);white-space:nowrap}
  .wk:hover{border-color:rgba(255,255,255,.2);color:var(--ink);transform:translateY(-1px)}
  .wk.on{background:linear-gradient(150deg,rgba(79,140,255,.95),rgba(160,107,255,.9));border-color:transparent;color:#fff;
         box-shadow:0 10px 26px -10px rgba(79,140,255,.75);font-weight:600}
  .wk.now::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:#2ed3a3;box-shadow:0 0 8px #2ed3a3}

  /* ---------- 课表 ---------- */
  .board{margin-top:8px;border:1px solid var(--line);border-radius:22px;background:rgba(12,14,22,.55);
         backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
         overflow:hidden;position:relative;
         box-shadow:0 40px 80px -50px #000,inset 0 1px 0 rgba(255,255,255,.06)}
  .scroller{overflow-x:auto;scrollbar-width:thin}
  .scroller::-webkit-scrollbar{height:8px}
  .scroller::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}

  .grid{display:grid;grid-template-columns:104px repeat(7,minmax(158px,1fr));min-width:1180px;position:relative}
  .hd{position:sticky;top:0;z-index:5;background:rgba(14,16,25,.94);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);padding:13px 8px 11px;text-align:center;
      font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--dim)}
  .hd small{display:block;font-weight:400;font-size:10.5px;color:var(--faint);margin-top:3px;letter-spacing:.08em}
  .hd.has{color:#fff}
  .hd.today small{color:#2ed3a3}

  .tl{position:sticky;left:0;z-index:4;background:rgba(14,16,25,.96);backdrop-filter:blur(12px);
      border-right:1px solid var(--line);border-bottom:1px solid rgba(255,255,255,.04);
      padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px}
  .tl b{font-size:12px;font-weight:600}
  .tl span{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .tl.sec{border-top:1px solid rgba(255,255,255,.16)}
  .cell{border-right:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.04)}
  .cell.sec{border-top:1px solid rgba(255,255,255,.16)}
  .cell.today{background:linear-gradient(180deg,rgba(46,211,163,.06),transparent 70%)}

  .card{
    margin:4px;border-radius:13px;padding:10px 11px;color:#fff;position:relative;overflow:hidden;z-index:1;
    display:flex;flex-direction:column;justify-content:center;gap:5px;
    background:var(--g);
    box-shadow:0 14px 30px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.22);
    cursor:pointer;transform-style:preserve-3d;
    transition:transform .45s var(--ease),box-shadow .45s var(--ease),filter .45s var(--ease);
    opacity:0;animation:cardIn .7s var(--spring) forwards;animation-delay:var(--d,0ms);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 15% 0%,rgba(255,255,255,.3),transparent 60%);opacity:.55}
  .card .glow{position:absolute;width:200px;height:200px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,255,255,.55),transparent 62%);opacity:0;transition:opacity .3s;
    transform:translate(-50%,-50%);mix-blend-mode:soft-light}
  .card:hover{filter:brightness(1.08);box-shadow:0 20px 44px -18px rgba(0,0,0,1),inset 0 1px 0 rgba(255,255,255,.3)}
  .card:hover .glow{opacity:.9}
  .card b{position:relative;z-index:2;font-size:12.5px;font-weight:600;line-height:1.32;letter-spacing:-.01em;word-break:break-word}
  .card .t{position:relative;z-index:2;font-size:10.5px;opacity:.9;font-variant-numeric:tabular-nums}
  .card .m{position:relative;z-index:2;font-size:10px;opacity:.72;line-height:1.35;overflow:hidden;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card.narrow{margin:4px 2px;padding:8px;width:calc(50% - 6px)}
  .card.narrow b{font-size:11px}
  .card.narrow .t{font-size:9.5px}
  .ln0{justify-self:start}
  .ln1{justify-self:end}

  .nowline{position:relative;z-index:3;pointer-events:none;height:2px;align-self:center;
    grid-column:1/-1;margin:0 0 0 88px;
    background:linear-gradient(90deg,rgba(46,211,163,0),#2ed3a3 12%,#2ed3a3 88%,rgba(46,211,163,0));
    box-shadow:0 0 18px rgba(46,211,163,.75)}
  .nowline::before{content:"";position:absolute;left:-6px;top:-3px;width:8px;height:8px;border-radius:50%;
    background:#2ed3a3;box-shadow:0 0 14px #2ed3a3}

  /* ---------- 列表 ---------- */
  .listhead{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px}
  .listhead h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--faint)}
  .listhead em{font-style:normal;color:var(--dim);font-size:12px}
  .list{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .row{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-radius:15px;
       border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);
       transition:all .4s var(--ease);cursor:pointer;opacity:0;animation:rowIn .6s var(--ease) forwards;animation-delay:var(--d,0ms)}
  @keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .row:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.055);transform:translateY(-2px)}
  .row .dot{width:4px;border-radius:4px;flex:0 0 auto;align-self:stretch;background:var(--g)}
  .row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .row .nm{font-weight:600;font-size:13.5px}
  .row .meta{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  .row .place{color:var(--faint);font-size:11px}
  .empty{color:var(--faint);font-size:12.5px;padding:24px 4px;grid-column:1/-1}

  /* ---------- 详情 ---------- */
  .veil{position:fixed;inset:0;z-index:60;background:rgba(4,5,9,.7);backdrop-filter:blur(10px);
        opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
  .veil.on{opacity:1;pointer-events:auto}
  .detail{position:fixed;z-index:61;left:50%;top:50%;width:min(430px,calc(100vw - 40px));
    transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;
    border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(170deg,rgba(24,27,40,.97),rgba(10,12,19,.99));
    box-shadow:0 50px 100px -40px #000;transition:all .5s var(--spring)}
  .detail.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .detail .top{height:6px;background:var(--g)}
  .detail .inner{padding:26px 26px 22px}
  .detail .tag{display:inline-flex;font-size:10.5px;letter-spacing:.18em;color:var(--faint);
    border:1px solid var(--line);border-radius:99px;padding:4px 11px}
  .detail h3{margin:14px 0 6px;font-size:23px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
  .detail .time{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .detail dl{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;margin:22px 0 0;font-size:13px}
  .detail dt{color:var(--faint);font-size:11px;letter-spacing:.1em;padding-top:2px}
  .detail dd{margin:0;color:var(--ink)}
  .detail button{margin-top:24px;width:100%;padding:13px;border-radius:14px;font:inherit;font-size:13.5px;
    color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--line);cursor:pointer;transition:background .3s}
  .detail button:hover{background:rgba(255,255,255,.14)}

  .foot{margin-top:34px;color:var(--faint);font-size:11px;line-height:1.9}

  @media (max-width:720px){
    .wrap{padding:calc(20px + env(safe-area-inset-top)) 14px 40px}
    .grid{grid-template-columns:84px repeat(7,minmax(132px,1fr));min-width:1008px}
    .list{grid-template-columns:1fr}
    .stat{gap:18px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>

<div class="aurora"><i></i><i></i><i></i></div>
<div class="grid-bg"></div>
<div class="vignette"></div>

<div class="wrap">
  <header>
    <div>
      <div class="kicker"><span class="live"></span><span>2026–2027 · 第一学期</span></div>
      <h1>九转<span>工具蛊</span></h1>
      <div class="sub">一节课 45 分钟 · 按周次筛选 · 同一时段不同周次的课并排显示</div>
    </div>
    <div class="stat">
      <div><b id="s-courses">0</b><small>课程时段</small></div>
      <div><b id="s-days">0</b><small>有课天数</small></div>
      <div><b id="s-week">—</b><small>当前周</small></div>
    </div>
  </header>

  <div class="weeks" id="weeks"></div>

  <div class="board">
    <div class="scroller"><div class="grid" id="grid"></div></div>
  </div>

  <div class="listhead">
    <h2 id="listTitle">课程清单</h2>
    <em id="listCount"></em>
  </div>
  <div class="list" id="list"></div>

  <div class="foot">
    色块 = 上课时段；点击任意课程查看完整信息 · 午休 12:15–14:00、晚饭 18:15–19:00 不占格子<br>
    地点省略统一的「海南校区」，只写楼名与房间号
  </div>
</div>

<div class="veil" id="veil"></div>
<div class="detail" id="detail">
  <div class="top"></div>
  <div class="inner">
    <span class="tag" id="d-tag">课程</span>
    <h3 id="d-name"></h3>
    <div class="time" id="d-time"></div>
    <dl>
      <dt>节次</dt><dd id="d-slot"></dd>
      <dt>周次</dt><dd id="d-week"></dd>
      <dt>教师</dt><dd id="d-teacher"></dd>
      <dt>地点</dt><dd id="d-place"></dd>
    </dl>
    <button id="d-close">收起</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const P = [
    ['第1节','08:00','08:45'],['第2节','08:50','09:35'],['第3节','09:50','10:35'],
    ['第4节','10:40','11:25'],['第5节','11:30','12:15'],['第6节','14:00','14:45'],
    ['第7节','14:50','15:35'],['第8节','15:50','16:35'],['第9节','16:40','17:25'],
    ['第10节','17:30','18:15'],['第11节','19:00','19:45'],['第12节','19:50','20:35'],
    ['第13节','20:45','21:30']
  ];
  const SECTIONS = {1:1, 6:1, 11:1};
  const MAXW = 20;

  const COURSES = [
    {d:1,s:3,e:5,  name:'钢琴小组课（一）_01',        teacher:'陈思远',     w:[3,4],   place:'民大专享楼博雅楼303'},
    {d:1,s:6,e:7,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[3,3],   place:'民大专享楼博雅楼217'},
    {d:1,s:6,e:7,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[4,17],  place:'公共教学楼301'},
    {d:1,s:8,e:10, name:'中华民族共同体概论_02',       teacher:'彭谦',       w:[3,9],   place:'公共教学楼109'},
    {d:1,s:8,e:9,  name:'大学生思想文化素养_02',       teacher:'宝艳园',     w:[10,18], place:'公共教学楼109'},
    {d:2,s:1,e:2,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[4,5],   place:'民大专享楼博文楼302'},
    {d:2,s:1,e:2,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[7,17],  place:'公共教学楼301'},
    {d:2,s:6,e:7,  name:'中国音乐史_01',              teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼404'},
    {d:2,s:8,e:10, name:'人工智能素养_02',            teacher:'杨国胜',     w:[7,18],  place:'公共教学楼509'},
    {d:3,s:3,e:4,  name:'音乐基础理论与视唱练耳（一）_01', teacher:'南思羽',  w:[3,18],  place:'民大专享楼博雅楼404'},
    {d:3,s:6,e:7,  name:'音乐基础理论与视唱练耳（一）_01', teacher:'南思羽',  w:[3,4],   place:'民大专享楼博雅楼301'},
    {d:3,s:8,e:10, name:'中华民族共同体概论_02',       teacher:'彭谦',       w:[3,7],   place:'公共教学楼109'},
    {d:3,s:8,e:9,  name:'大学生思想文化素养_02',       teacher:'宝艳园',     w:[10,18], place:'公共教学楼109'},
    {d:4,s:1,e:2,  name:'人工智能素养_02',            teacher:'杨国胜',     w:[6,14],  place:'公共教学楼216'},
    {d:4,s:3,e:4,  name:'中国音乐史_01',              teacher:'郭艺婧',     w:[3,4],   place:'民大专享楼博雅楼404'},
    {d:4,s:6,e:7,  name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,5],   place:'民大专享楼博雅楼301'},
    {d:4,s:8,e:10, name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼301'},
    {d:5,s:3,e:5,  name:'钢琴小组课（一）_01',         teacher:'陈思远',     w:[3,18],  place:'民大专享楼博雅楼303'},
    {d:5,s:6,e:7,  name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,5],   place:'民大专享楼博雅楼301'},
    {d:5,s:8,e:10, name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼301'},
    {d:5,s:11,e:12,name:'大学体育（一）_04',           teacher:'李文华',     w:[3,18],  place:'运动场所游泳馆1楼'}
  ];

  const DAYS = ['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];

  const PALETTE = [
    'linear-gradient(150deg,#4f8cff,#2554c7)',
    'linear-gradient(150deg,#a06bff,#6633cc)',
    'linear-gradient(150deg,#ff9f43,#cc6a12)',
    'linear-gradient(150deg,#2ed3a3,#0e8c6b)',
    'linear-gradient(150deg,#ff6b8a,#c73156)',
    'linear-gradient(150deg,#38bdf8,#0c7bb3)',
    'linear-gradient(150deg,#f6d365,#c69a1e)',
    'linear-gradient(150deg,#8b5cf6,#5b21b6)',
    'linear-gradient(150deg,#4ecdc4,#1a8f88)',
    'linear-gradient(150deg,#84cc16,#4d7c0f)'
  ];
  const names = [...new Set(COURSES.map(c => c.name))];
  const colorOf = (name) => PALETTE[Math.max(0, names.indexOf(name)) % PALETTE.length];

  let curWeek = 'all';
  let lastKey = '';

  const wb = document.getElementById('weeks');
  wb.innerHTML = '<button class="wk on" data-w="all">全部</button>' +
    Array.from({length: MAXW}, (_, i) =>
      `<button class="wk${i + 1 === 3 ? ' now' : ''}" data-w="${i + 1}">第 ${i + 1} 周</button>`).join('');

  wb.addEventListener('click', (ev) => {
    const b = ev.target.closest('.wk');
    if (!b) return;
    curWeek = b.dataset.w === 'all' ? 'all' : Number(b.dataset.w);
    wb.querySelectorAll('.wk').forEach((c) => c.classList.toggle('on', c === b));
    render(true);
  });

  const active = (c) => curWeek === 'all' || (curWeek >= c.w[0] && curWeek <= c.w[1]);
  const wkText = (c) => (c.w[0] === c.w[1] ? `第 ${c.w[0]} 周` : `${c.w[0]} – ${c.w[1]} 周`);
  const overlap = (a, b) => a.d === b.d && a.s <= b.e && b.s <= a.e;

  const grid = document.getElementById('grid');

  function render(animate) {
    const all = COURSES.slice().sort((a, b) => a.d - b.d || a.s - b.s);
    const shown = all.filter(active);
    const todayCol = (new Date().getDay() + 6) % 7 + 1;

    if (animate && lastKey) {
      grid.style.transition = 'opacity .18s ease, transform .18s ease';
      grid.style.opacity = '0';
      grid.style.transform = 'translateY(6px)';
    }

    const paint = () => {
      grid.style.gridTemplateRows = 'auto repeat(13,minmax(56px,auto))';
      let html = '<div class="hd">节次 / 时间</div>';
      DAYS.forEach((d, i) => {
        const n = shown.filter((c) => c.d === i + 1).length;
        html += `<div class="hd${n ? ' has' : ''}">${d}<small>${n ? n + ' 门' : '—'}</small></div>`;
      });

      P.forEach((p, i) => {
        const n = i + 1, sec = SECTIONS[n] ? ' sec' : '';
        html += `<div class="tl${sec}" style="grid-row:${n + 1};grid-column:1"><b>${p[0]}</b><span>${p[1]} – ${p[2]}</span></div>`;
        for (let d = 1; d <= 7; d++) {
          html += `<div class="cell${sec}${d === todayCol ? ' today' : ''}" style="grid-row:${n + 1};grid-column:${d + 1}"></div>`;
        }
      });

      shown.forEach((c, i) => {
        const rivals = shown.filter((o) => o !== c && overlap(o, c));
        const lane = rivals.length ? (rivals.filter((o) => o.s < c.s || (o.s === c.s && o.w[0] < c.w[0])).length % 2) : 0;
        const narrow = rivals.length ? ` narrow ln${lane}` : '';
        html += `<div class="card${narrow}" data-i="${all.indexOf(c)}"
          style="grid-row:${c.s + 1} / ${c.e + 2};grid-column:${c.d + 1};--g:${colorOf(c.name)};--d:${Math.min(i * 26, 520)}ms">
          <span class="glow"></span>
          <b>${c.name}</b>
          <span class="t">${P[c.s - 1][1]}–${P[c.e - 1][2]}</span>
          ${(c.e - c.s + 1) >= 2 ? `<span class="m">${wkText(c)} · ${c.place}</span>` : ''}
        </div>`;
      });

      // 当前时段指示线
      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();
      let row = 0;
      P.forEach((p, i) => {
        const [h1, m1] = p[1].split(':').map(Number);
        const [h2, m2] = p[2].split(':').map(Number);
        if (mins >= h1 * 60 + m1 && mins <= h2 * 60 + m2) row = i + 1;
      });
      if (row) html += `<div class="nowline" style="grid-row:${row + 1};grid-column:1/-1;align-self:center"></div>`;

      grid.innerHTML = html;
      grid.style.opacity = '1';
      grid.style.transform = 'none';
      lastKey = shown.map((c) => c.name + c.s).join('|');

      grid.querySelectorAll('.card').forEach((card) => {
        const glow = card.querySelector('.glow');
        card.addEventListener('pointermove', (e) => {
          const r = card.getBoundingClientRect();
          glow.style.left = (e.clientX - r.left) + 'px';
          glow.style.top = (e.clientY - r.top) + 'px';
          const rx = ((e.clientY - r.top) / r.height - .5) * -5;
          const ry = ((e.clientX - r.left) / r.width - .5) * 5;
          card.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-2px)`;
        });
        card.addEventListener('pointerleave', () => { card.style.transform = ''; });
        card.addEventListener('click', () => openDetail(all[Number(card.dataset.i)]));
      });

      document.getElementById('listTitle').textContent = curWeek === 'all' ? '全部课程' : `第 ${curWeek} 周课程`;
      document.getElementById('listCount').textContent = `${shown.length} 个时段`;
      const list = document.getElementById('list');
      if (!shown.length) {
        list.innerHTML = '<div class="empty">这一周没有课，好好休息。</div>';
      } else {
        list.innerHTML = shown.map((c, i) => `
          <div class="row" data-i="${all.indexOf(c)}" style="--g:${colorOf(c.name)};--d:${Math.min(i * 24, 400)}ms">
            <span class="dot"></span>
            <span class="body">
              <span class="nm">${c.name}</span>
              <span class="meta">${DAYS[c.d - 1]} · ${P[c.s - 1][1]}–${P[c.e - 1][2]} · ${c.s}–${c.e} 节 · ${wkText(c)}</span>
              <span class="place">${c.place} · ${c.teacher}</span>
            </span>
          </div>`).join('');
        list.querySelectorAll('.row').forEach((r) =>
          r.addEventListener('click', () => openDetail(all[Number(r.dataset.i)])));
      }

      document.getElementById('s-courses').textContent = shown.length;
      document.getElementById('s-days').textContent = new Set(shown.map((c) => c.d)).size;
      document.getElementById('s-week').textContent = curWeek === 'all' ? '全部' : curWeek;
    };

    if (animate && lastKey) setTimeout(paint, 170);
    else paint();
  }

  const veil = document.getElementById('veil');
  const detail = document.getElementById('detail');
  function openDetail(c) {
    if (!c) return;
    document.getElementById('d-tag').textContent = DAYS[c.d - 1];
    document.getElementById('d-name').textContent = c.name;
    document.getElementById('d-time').textContent = `${P[c.s - 1][1]} – ${P[c.e - 1][2]}　（${(c.e - c.s + 1) * 45} 分钟）`;
    document.getElementById('d-slot').textContent = c.s === c.e ? `第 ${c.s} 节` : `第 ${c.s} – ${c.e} 节`;
    document.getElementById('d-week').textContent = wkText(c);
    document.getElementById('d-teacher').textContent = c.teacher;
    document.getElementById('d-place').textContent = c.place;
    detail.style.setProperty('--g', colorOf(c.name));
    veil.classList.add('on');
    detail.classList.add('on');
  }
  const closeDetail = () => { veil.classList.remove('on'); detail.classList.remove('on'); };
  veil.addEventListener('click', closeDetail);
  document.getElementById('d-close').addEventListener('click', closeDetail);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

  render(false);
})();
</script>
</body>
</html>
