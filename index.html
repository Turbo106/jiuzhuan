<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<title>九转工具蛊</title>
<style>
  :root{
    --bg:#08090a;
    --panel:#0f1011;
    --raise:#191a1b;
    --hover:#1f2023;
    --line:rgba(255,255,255,.05);
    --line-2:rgba(255,255,255,.08);
    --txt:#f7f8f8;
    --txt-2:#d0d6e0;
    --txt-3:#8a8f98;
    --txt-4:#62666d;
    --brand:#5e6ad2;
    --brand-2:#7170ff;
    --ease:cubic-bezier(.25,.46,.45,.94);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
    font-feature-settings:"cv01","ss03";
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 28px 80px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:34px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(140deg,#5e6ad2,#7170ff);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .brand h1{margin:0;font-size:15px;font-weight:510;letter-spacing:-.01em;color:var(--txt)}
  .brand .meta{font-size:12px;color:var(--txt-4);letter-spacing:-.13px;margin-top:1px}

  .weeks{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:0 0 auto;border:1px solid var(--line-2);background:transparent;color:var(--txt-3);
      border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;font-weight:510;letter-spacing:-.13px;
      cursor:pointer;transition:all .15s var(--ease);white-space:nowrap}
  .wk:hover{background:rgba(255,255,255,.04);color:var(--txt-2);border-color:rgba(255,255,255,.12)}
  .wk.on{background:var(--brand);border-color:transparent;color:#fff}
  .wk.on:hover{background:#5e6ad2}

  /* ---------- summary ---------- */
  .summary{display:flex;gap:28px;margin-bottom:18px;padding-left:2px}
  .summary div{display:flex;align-items:baseline;gap:6px}
  .summary b{font-size:13px;font-weight:510;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-.13px}
  .summary span{font-size:12px;color:var(--txt-4);letter-spacing:-.13px}

  /* ---------- board ---------- */
  .board{border:1px solid var(--line-2);border-radius:12px;background:var(--panel);overflow:hidden;
         box-shadow:rgba(0,0,0,.2) 0 0 0 1px,rgba(0,0,0,.3) 0 20px 40px -20px}
  .scroller{overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
  .scroller::-webkit-scrollbar{height:8px}
  .scroller::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}

  .grid{display:grid;grid-template-columns:104px repeat(7,minmax(168px,1fr));min-width:1240px;position:relative}

  .hd{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line-2);
      padding:12px 8px;text-align:center;font-size:12px;font-weight:510;letter-spacing:-.13px;color:var(--txt-3)}
  .hd small{display:block;font-size:11px;font-weight:400;color:var(--txt-4);margin-top:2px}
  .hd.has{color:var(--txt-2)}
  .hd.today{color:var(--txt)}
  .hd.today small{color:var(--brand-2)}

  .tl{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);padding:7px 12px;display:flex;flex-direction:column;justify-content:center;gap:1px}
  .tl b{font-size:11.5px;font-weight:510;color:var(--txt-2);letter-spacing:-.13px}
  .tl span{font-size:10.5px;color:var(--txt-4);font-variant-numeric:tabular-nums}
  .tl.sec{border-top:1px solid var(--line-2)}
  .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell.sec{border-top:1px solid var(--line-2)}
  .cell.today{background:rgba(94,106,210,.04)}

  /* ---------- card ---------- */
  .card{
    margin:3px;border-radius:6px;padding:8px 9px;position:relative;z-index:1;
    background:rgba(255,255,255,.03);border:1px solid var(--line-2);
    display:flex;flex-direction:column;justify-content:center;gap:3px;
    cursor:pointer;transition:background .15s var(--ease),border-color .15s var(--ease);
    overflow:hidden;
  }
  .card:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}
  .card:active{background:rgba(255,255,255,.09)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c)}
  .card b{font-size:11.5px;font-weight:510;line-height:1.4;letter-spacing:-.13px;color:var(--txt);
          padding-left:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .t{font-size:10.5px;color:var(--txt-3);font-variant-numeric:tabular-nums;letter-spacing:-.13px;padding-left:5px}
  .card .m{font-size:10.5px;color:var(--txt-4);line-height:1.4;padding-left:5px;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.narrow{margin:3px 2px;padding:7px;width:calc(50% - 5px)}
  .card.narrow b{font-size:11px}
  .card.narrow .t,.card.narrow .m{font-size:9.5px}
  .ln0{justify-self:start}
  .ln1{justify-self:end}

  .nowline{grid-column:1/-1;height:1px;align-self:center;margin-left:104px;
           background:linear-gradient(90deg,transparent,var(--brand) 15%,var(--brand) 85%,transparent);
           box-shadow:0 0 8px rgba(94,106,210,.6);position:relative}
  .nowline::before{content:"";position:absolute;left:-3px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--brand-2)}

  /* ---------- list ---------- */
  .listhead{display:flex;align-items:center;justify-content:space-between;margin:36px 0 12px}
  .listhead h2{margin:0;font-size:13px;font-weight:510;letter-spacing:-.13px;color:var(--txt-2)}
  .listhead span{font-size:12px;color:var(--txt-4)}
  .list{display:grid;gap:1px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--line-2)}
  .row{display:grid;grid-template-columns:20px 1fr auto;gap:14px;align-items:center;
       padding:13px 16px;background:var(--panel);cursor:pointer;transition:background .12s var(--ease)}
  .row:hover{background:var(--raise)}
  .row .dot{width:2px;height:20px;border-radius:2px;background:var(--c)}
  .row .nm{font-size:13px;font-weight:510;letter-spacing:-.13px;color:var(--txt)}
  .row .meta{font-size:11.5px;color:var(--txt-4);margin-top:2px;font-variant-numeric:tabular-nums}
  .row .when{font-size:11.5px;color:var(--txt-3);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .empty{padding:40px;text-align:center;color:var(--txt-4);font-size:13px;background:var(--panel)}

  /* ---------- popover ---------- */
  .veil{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);opacity:0;pointer-events:none;transition:opacity .18s var(--ease)}
  .veil.on{opacity:1;pointer-events:auto}
  .pop{position:fixed;z-index:61;left:50%;top:50%;width:min(420px,calc(100vw - 32px));
    transform:translate(-50%,-50%) scale(.97);opacity:0;pointer-events:none;
    background:var(--raise);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;
    box-shadow:rgba(0,0,0,0) 0 8px 2px,rgba(0,0,0,.01) 0 5px 2px,rgba(0,0,0,.04) 0 3px 2px,rgba(0,0,0,.07) 0 1px 1px,rgba(0,0,0,.08) 0 0 1px;
    transition:transform .18s var(--ease),opacity .18s var(--ease)}
  .pop.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .pop .bar{height:3px;background:var(--c)}
  .pop .in{padding:22px 22px 18px}
  .pop .eyebrow{font-size:11px;font-weight:510;letter-spacing:.06em;color:var(--txt-4);text-transform:uppercase}
  .pop h3{margin:9px 0 4px;font-size:19px;font-weight:590;letter-spacing:-.24px;line-height:1.3;color:var(--txt)}
  .pop .sub{font-size:12.5px;color:var(--txt-3);font-variant-numeric:tabular-nums}
  .pop dl{display:grid;grid-template-columns:64px 1fr;gap:10px 14px;margin:20px 0 0;font-size:12.5px}
  .pop dt{color:var(--txt-4);font-size:11.5px}
  .pop dd{margin:0;color:var(--txt-2)}
  .pop button{margin-top:20px;width:100%;padding:9px;border-radius:6px;font:inherit;font-size:12.5px;font-weight:510;
    color:var(--txt-2);background:rgba(255,255,255,.02);border:1px solid var(--line-2);cursor:pointer;
    transition:background .15s var(--ease)}
  .pop button:hover{background:rgba(255,255,255,.06)}

  .foot{margin-top:32px;font-size:11.5px;color:var(--txt-4);line-height:1.9;letter-spacing:-.13px}

  @media (max-width:760px){
    .wrap{padding:calc(24px + env(safe-area-inset-top)) 16px 60px}
    .grid{grid-template-columns:80px repeat(7,minmax(148px,1fr));min-width:1080px}
    .summary{gap:18px}
    .row{grid-template-columns:16px 1fr;gap:12px}
    .row .when{grid-column:2;text-align:left;margin-top:-2px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>九转工具蛊</h1>
        <div class="meta">2026–2027 第一学期 · 20 周</div>
      </div>
    </div>
    <div class="weeks" id="weeks"></div>
  </div>

  <div class="summary">
    <div><b id="s-count">0</b><span>个时段</span></div>
    <div><b id="s-days">0</b><span>天有课</span></div>
    <div><b id="s-hours">0</b><span>节课</span></div>
  </div>

  <div class="board">
    <div class="scroller"><div class="grid" id="grid"></div></div>
  </div>

  <div class="listhead">
    <h2 id="listTitle">课程</h2>
    <span id="listHint"></span>
  </div>
  <div class="list" id="list"></div>

  <div class="foot">
    点击课程查看详情 · 午休 12:15–14:00、晚饭 18:15–19:00 不占格子 · 地点省略统一的「海南校区」
  </div>
</div>

<div class="veil" id="veil"></div>
<div class="pop" id="pop">
  <div class="bar"></div>
  <div class="in">
    <div class="eyebrow" id="p-day"></div>
    <h3 id="p-name"></h3>
    <div class="sub" id="p-time"></div>
    <dl>
      <dt>节次</dt><dd id="p-slot"></dd>
      <dt>周次</dt><dd id="p-week"></dd>
      <dt>教师</dt><dd id="p-teacher"></dd>
      <dt>地点</dt><dd id="p-place"></dd>
    </dl>
    <button id="p-close">关闭</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const P = [
    ['第1节','08:00','08:45'],['第2节','08:50','09:35'],['第3节','09:50','10:35'],
    ['第4节','10:40','11:25'],['第5节','11:30','12:15'],['第6节','14:00','14:45'],
    ['第7节','14:50','15:35'],['第8节','15:50','16:35'],['第9节','16:40','17:25'],
    ['第10节','17:30','18:15'],['第11节','19:00','19:45'],['第12节','19:50','20:35'],
    ['第13节','20:45','21:30']
  ];
  const SECTIONS = {1:1, 6:1, 11:1};
  const MAXW = 20;

  const COURSES = [
    {d:1,s:3,e:5,  name:'钢琴小组课（一）_01',        teacher:'陈思远',     w:[3,4],   place:'民大专享楼博雅楼303'},
    {d:1,s:6,e:7,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[3,3],   place:'民大专享楼博雅楼217'},
    {d:1,s:6,e:7,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[4,17],  place:'公共教学楼301'},
    {d:1,s:8,e:10, name:'中华民族共同体概论_02',       teacher:'彭谦',       w:[3,9],   place:'公共教学楼109'},
    {d:1,s:8,e:9,  name:'大学生思想文化素养_02',       teacher:'宝艳园',     w:[10,18], place:'公共教学楼109'},
    {d:2,s:1,e:2,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[4,5],   place:'民大专享楼博文楼302'},
    {d:2,s:1,e:2,  name:'大学英语（雅思英语）（一）_05', teacher:'Sabrina Lin', w:[7,17],  place:'公共教学楼301'},
    {d:2,s:6,e:7,  name:'中国音乐史_01',              teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼404'},
    {d:2,s:8,e:10, name:'人工智能素养_02',            teacher:'杨国胜',     w:[7,18],  place:'公共教学楼509'},
    {d:3,s:3,e:4,  name:'音乐基础理论与视唱练耳（一）_01', teacher:'南思羽',  w:[3,18],  place:'民大专享楼博雅楼404'},
    {d:3,s:6,e:7,  name:'音乐基础理论与视唱练耳（一）_01', teacher:'南思羽',  w:[3,4],   place:'民大专享楼博雅楼301'},
    {d:3,s:8,e:10, name:'中华民族共同体概论_02',       teacher:'彭谦',       w:[3,7],   place:'公共教学楼109'},
    {d:3,s:8,e:9,  name:'大学生思想文化素养_02',       teacher:'宝艳园',     w:[10,18], place:'公共教学楼109'},
    {d:4,s:1,e:2,  name:'人工智能素养_02',            teacher:'杨国胜',     w:[6,14],  place:'公共教学楼216'},
    {d:4,s:3,e:4,  name:'中国音乐史_01',              teacher:'郭艺婧',     w:[3,4],   place:'民大专享楼博雅楼404'},
    {d:4,s:6,e:7,  name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,5],   place:'民大专享楼博雅楼301'},
    {d:4,s:8,e:10, name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼301'},
    {d:5,s:3,e:5,  name:'钢琴小组课（一）_01',         teacher:'陈思远',     w:[3,18],  place:'民大专享楼博雅楼303'},
    {d:5,s:6,e:7,  name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,5],   place:'民大专享楼博雅楼301'},
    {d:5,s:8,e:10, name:'音乐小组课（一）_01',         teacher:'郭艺婧',     w:[3,18],  place:'民大专享楼博雅楼301'},
    {d:5,s:11,e:12,name:'大学体育（一）_04',           teacher:'李文华',     w:[3,18],  place:'运动场所游泳馆1楼'}
  ];

  const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];

  // 低饱和色条：只用 5 个冷色，全部 45% 饱和度
  const TONE = [
    'hsl(232 62% 66%)', // indigo
    'hsl(196 55% 62%)', // cyan
    'hsl(160 42% 58%)', // teal
    'hsl(264 45% 68%)', // violet
    'hsl(28 48% 64%)'   // sand
  ];
  const names = [...new Set(COURSES.map(c => c.name))];
  const tone = (name) => TONE[Math.max(0, names.indexOf(name)) % TONE.length];

  let curWeek = 'all';
  let lastKey = '';

  const wb = document.getElementById('weeks');
  wb.innerHTML = '<button class="wk on" data-w="all">全部</button>' +
    Array.from({length: MAXW}, (_, i) => `<button class="wk" data-w="${i+1}">${i+1}周</button>`).join('');

  wb.addEventListener('click', (ev) => {
    const b = ev.target.closest('.wk');
    if (!b) return;
    curWeek = b.dataset.w === 'all' ? 'all' : Number(b.dataset.w);
    wb.querySelectorAll('.wk').forEach(c => c.classList.toggle('on', c === b));
    render(true);
  });

  const active = (c) => curWeek === 'all' || (curWeek >= c.w[0] && curWeek <= c.w[1]);
  const wkText = (c) => (c.w[0] === c.w[1] ? `第 ${c.w[0]} 周` : `${c.w[0]}–${c.w[1]} 周`);
  const overlap = (a, b) => a.d === b.d && a.s <= b.e && b.s <= a.e;

  const grid = document.getElementById('grid');

  function render(animate) {
    const all = COURSES.slice().sort((a, b) => a.d - b.d || a.s - b.s);
    const shown = all.filter(active);
    const todayCol = (new Date().getDay() + 6) % 7 + 1;

    if (animate && lastKey) {
      grid.style.transition = 'opacity .12s linear';
      grid.style.opacity = '0';
    }

    const paint = () => {
      grid.style.gridTemplateRows = 'auto repeat(13,minmax(58px,auto))';
      let html = '<div class="hd">时间</div>';
      DAYS.forEach((d, i) => {
        const n = shown.filter(c => c.d === i + 1).length;
        html += `<div class="hd${n ? ' has' : ''}${i + 1 === todayCol ? ' today' : ''}">${d}<small>${n ? n + ' 节' : '—'}</small></div>`;
      });

      P.forEach((p, i) => {
        const n = i + 1, sec = SECTIONS[n] ? ' sec' : '';
        html += `<div class="tl${sec}" style="grid-row:${n+1};grid-column:1"><b>${n}</b><span>${p[1]}</span></div>`;
        for (let d = 1; d <= 7; d++) {
          html += `<div class="cell${sec}${d === todayCol ? ' today' : ''}" style="grid-row:${n+1};grid-column:${d+1}"></div>`;
        }
      });

      shown.forEach((c) => {
        const rivals = shown.filter(o => o !== c && overlap(o, c));
        const lane = rivals.length ? (rivals.filter(o => o.s < c.s || (o.s === c.s && o.w[0] < c.w[0])).length % 2) : 0;
        const narrow = rivals.length ? ` narrow ln${lane}` : '';
        html += `<div class="card${narrow}" data-i="${all.indexOf(c)}"
          style="grid-row:${c.s+1} / ${c.e+2};grid-column:${c.d+1};--c:${tone(c.name)}">
          <b>${c.name}</b>
          <span class="t">${P[c.s-1][1]}–${P[c.e-1][2]}</span>
          ${(c.e - c.s + 1) >= 3 ? `<span class="m">${c.place}</span>` : ''}
        </div>`;
      });

      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();
      let row = 0;
      P.forEach((p, i) => {
        const [h1, m1] = p[1].split(':').map(Number);
        const [h2, m2] = p[2].split(':').map(Number);
        if (mins >= h1 * 60 + m1 && mins <= h2 * 60 + m2) row = i + 1;
      });
      if (row) html += `<div class="nowline" style="grid-row:${row+1};grid-column:1/-1"></div>`;

      grid.innerHTML = html;
      grid.style.opacity = '1';
      lastKey = shown.map(c => c.name + c.s).join('|');

      grid.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => openPop(all[Number(card.dataset.i)]));
      });

      document.getElementById('s-count').textContent = shown.length;
      document.getElementById('s-days').textContent = new Set(shown.map(c => c.d)).size;
      document.getElementById('s-hours').textContent = shown.reduce((a, c) => a + (c.e - c.s + 1), 0);

      document.getElementById('listTitle').textContent = curWeek === 'all' ? '全部课程' : `第 ${curWeek} 周`;
      document.getElementById('listHint').textContent = `${shown.length} 个时段`;

      const list = document.getElementById('list');
      if (!shown.length) {
        list.innerHTML = '<div class="empty">这一周没有课</div>';
      } else {
        list.innerHTML = shown.map(c => `
          <div class="row" data-i="${all.indexOf(c)}" style="--c:${tone(c.name)}">
            <span class="dot"></span>
            <span>
              <div class="nm">${c.name}</div>
              <div class="meta">${c.place} · ${c.teacher}</div>
            </span>
            <span class="when">${DAYS[c.d-1]} ${P[c.s-1][1]}–${P[c.e-1][2]}<br><small>${wkText(c)}</small></span>
          </div>`).join('');
        list.querySelectorAll('.row').forEach(r =>
          r.addEventListener('click', () => openPop(all[Number(r.dataset.i)])));
      }
    };

    if (animate && lastKey) setTimeout(paint, 130);
    else paint();
  }

  const veil = document.getElementById('veil');
  const pop = document.getElementById('pop');
  function openPop(c) {
    if (!c) return;
    document.getElementById('p-day').textContent = DAYS[c.d - 1];
    document.getElementById('p-name').textContent = c.name;
    document.getElementById('p-time').textContent = `${P[c.s-1][1]} – ${P[c.e-1][2]} · ${(c.e-c.s+1)*45} 分钟`;
    document.getElementById('p-slot').textContent = c.s === c.e ? `第 ${c.s} 节` : `第 ${c.s}–${c.e} 节`;
    document.getElementById('p-week').textContent = wkText(c);
    document.getElementById('p-teacher').textContent = c.teacher;
    document.getElementById('p-place').textContent = c.place;
    pop.style.setProperty('--c', tone(c.name));
    veil.classList.add('on'); pop.classList.add('on');
  }
  const closePop = () => { veil.classList.remove('on'); pop.classList.remove('on'); };
  veil.addEventListener('click', closePop);
  document.getElementById('p-close').addEventListener('click', closePop);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

  render(false);
})();
</script>
</body>
</html>
